name: Build EnhancedCreatureInformation
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show committed project settings
        shell: cmd
        run: findstr /i /c:"TargetName" /c:"TargetExt" /c:"OutDir" /c:"RuntimeLibrary" /c:"ConfigurationType" /c:"TargetMachine" Interface_EnhancedCreatureInformation\Interface_EnhancedCreatureInformation.vcxproj

      - uses: microsoft/setup-msbuild@v2

      - name: Build x86 Release
        shell: cmd
        run: msbuild Interface_EnhancedCreatureInformation\Interface_EnhancedCreatureInformation.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:OutDir=%GITHUB_WORKSPACE%\out\ /v:minimal

      - name: List build outputs
        shell: cmd
        run: dir /s /b %GITHUB_WORKSPACE%\out

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Inspect outputs
        shell: cmd
        run: |
          for %%f in (%GITHUB_WORKSPACE%\out\*.dll %GITHUB_WORKSPACE%\out\*.era) do (
            echo ===== %%f
            dumpbin /headers /dependents "%%f" | findstr /i /c:"machine" /c:".dll" /c:"subsystem"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            out/*.dll
            out/*.era
          if-no-files-found: error
